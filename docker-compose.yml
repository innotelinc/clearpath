services:
  clearpath:
    build: .
    image: clearpath:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      DB_PATH: /data/clearpath.db
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SEED_DEMO: ${SEED_DEMO:-0}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-hello@denovocredit.com}
      MAIL_FROM: ${MAIL_FROM:-Clearpath <no-reply@denovocredit.com>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-}
      LOB_API_KEY: ${LOB_API_KEY:-}
      LOB_WEBHOOK_SECRET: ${LOB_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - clearpath-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  clearpath-data:
