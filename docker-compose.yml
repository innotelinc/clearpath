services:
  clearpath:
    build: .
    image: clearpath:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      DB_PATH: /data/clearpath.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SEED_DEMO: ${SEED_DEMO:-0}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-hello@denovocredit.com}
    volumes:
      - clearpath-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  clearpath-data:
